name: Release

# Keeps ONE open pull request called "chore(main): release X.Y.Z" up to date. It holds the new
# CHANGELOG.md entry and the version bump. Merging that pull request is what creates the tag
# (vX.Y.Z) and the GitHub Release, and then the built wheel and sdist are attached to it.
# Nothing is tagged or released until a person merges that pull request.
#
# The release pull request is opened with a personal access token (secret RELEASE_PLEASE_TOKEN),
# because pull requests opened with the default token do not start CI, and then the required
# check `ci-ok` would never appear on it. Without that secret this still works, but CI will not
# run on the release pull request. See docs/releasing.md.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # Releases come from main only. The trigger above already limits this to pushes to main;
    # this guard keeps it true if someone later adds workflow_dispatch or more branches.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  attach-build:
    # Runs only in the run where the release pull request was merged and a release was created.
    name: Attach wheel and sdist to the release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and validate
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*

      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber
