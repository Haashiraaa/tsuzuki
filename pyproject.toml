[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tsuzuki"
version = "0.5.0"
description = "Personal command-line tool for downloading anime episodes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Haashiraaa" }]
keywords = ["anime", "downloader", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Environment :: Console",
    "Typing :: Typed",
]

# Runtime dependencies live here and nowhere else (no requirements.txt).
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "tqdm>=4.66",
    "haashi>=1.3,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "build>=1.2",
]

[project.urls]
Repository = "https://github.com/Haashiraaa/tsuzuki"

[project.scripts]
tsuzuki = "tsuzuki.cli:main"

[tool.setuptools]
package-dir = { "" = "backend/src" }

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.setuptools.package-data]
tsuzuki = ["py.typed", "storage/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend/src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["backend/src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["tsuzuki", "tests"]

[tool.pyright]
include = ["backend/src", "scripts", "tests"]
strict = ["backend/src"]
pythonVersion = "3.10"
