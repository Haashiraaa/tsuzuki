# Only for running the `alembic` command while developing (for example `alembic revision`).
# Tsuzuki itself configures Alembic in code (backend/src/tsuzuki/storage/migrate.py).
[alembic]
script_location = backend/src/tsuzuki/storage/migrations
sqlalchemy.url = sqlite:///tsuzuki-dev.db
file_template = %%(rev)s_%%(slug)s
